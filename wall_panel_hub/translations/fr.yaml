configuration:
  panel_port:
    name: "Port des écrans"
    description: "Le port qu'utilisent les écrans du réseau local pour s'associer et se connecter."
  tls_port:
    name: "Port chiffré des écrans"
    description: "Le port chiffré sur lequel se connectent les écrans du réseau local. Les écrans y passent d'eux-mêmes ; le port des écrans reste pour les applications plus anciennes."
  sip_port:
    name: "Port SIP de l'interphone"
    description: "Le port SIP de l'interphone, pour les portiers et autres appareils SIP. Le son des appels utilise l'UDP 10000-10199."
