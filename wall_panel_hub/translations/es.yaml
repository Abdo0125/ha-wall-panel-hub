configuration:
  panel_port:
    name: "Puerto de las pantallas"
    description: "El puerto que usan las pantallas de la red local para vincularse y conectarse."
  tls_port:
    name: "Puerto cifrado de las pantallas"
    description: "El puerto cifrado en el que se conectan las pantallas de la red local. Las pantallas pasan a él solas; el puerto de las pantallas queda para las aplicaciones más antiguas."
  sip_port:
    name: "Puerto SIP del intercomunicador"
    description: "El puerto SIP del intercomunicador, para porteros y otros dispositivos SIP. El sonido de las llamadas usa UDP 10000-10199."
