<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Panels</title>
<style>
  @font-face { font-family: "mdi"; src: url("static/vendor/mdi/materialdesignicons.ttf") format("truetype"); font-display: block; }
  :root {
    --bg: #111317; --pane: #181b20; --fg: #e9ebee; --muted: #8c9298; --line: #2b2f35;
    --accent: #e0a060; --accent-bg: rgba(224,160,96,.14); --danger: #e06060; --ok: #6cc56c;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2f3f5; --pane: #fff; --fg: #2b2f33; --muted: #6b7178; --line: #d7dade; --accent: #9a6420; --accent-bg: rgba(154,100,32,.10); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; }
  button { background: none; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
           cursor: pointer; font: inherit; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  input, select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; }
  input[type=checkbox] { width: auto; }
  .muted { color: var(--muted); font-size: 13px; }
  .mdi { font-family: "mdi"; font-style: normal; line-height: 1; display: inline-block; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--pane); }
  header h1 { font-size: 16px; margin: 0; }
  header .warn { color: var(--accent); font-size: 13px; }
  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }

  /* ---- navigation ---- */
  nav { border-inline-end: 1px solid var(--line); background: var(--pane); overflow: auto; padding: 10px; }
  nav h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 14px 6px 6px; }
  .navitem { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .navitem:hover { background: var(--accent-bg); }
  .navitem.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .navitem .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { font-size: 10px; } .dot.on { color: var(--ok); } .dot.off { color: var(--muted); }
  .request { border: 1px dashed var(--accent); border-radius: 8px; padding: 8px 10px; margin: 4px 0; }
  .request .code { font-family: monospace; font-size: 18px; letter-spacing: 3px; color: var(--accent); }

  main { overflow: auto; padding: 16px 20px; min-width: 0; }
  .titlebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .titlebar h2 { margin: 0; font-size: 18px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .spacer { flex: 1; }
  .box { background: var(--pane); border: 1px solid var(--line); border-radius: 12px; padding: 16px; max-width: 820px; margin-bottom: 16px; }
  .box h3 { font-size: 14px; margin: 0 0 10px; }
  .form { display: grid; grid-template-columns: 220px 1fr; gap: 10px 14px; align-items: center; }
  .form label { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: middle; }
  th { color: var(--muted); font-weight: normal; font-size: 13px; }
  .access td, .access th { text-align: center; } .access td:first-child, .access th:first-child { text-align: start; }
  .msg { font-size: 13px; margin-top: 8px; } .msg.ok { color: var(--ok); } .msg.error { color: var(--danger); } .msg.warn { color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 16px; padding: 4px 12px; cursor: pointer; user-select: none; font-size: 13px; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .chip.off { opacity: .4; cursor: default; }

  /* ---- the panel, as it looks on the wall ---- */
  .device { --cell: #fff; --divider: #d7dade; --icon: #5f656c; --active: #f2b300; --text: #2b2f33; --dmuted: #8c9298; --side: #f1f2f4;
            display: grid; grid-template-columns: 1fr; width: 100%; max-width: 1080px; aspect-ratio: 16 / 10;
            border: 10px solid #222; border-radius: 18px; overflow: hidden; background: var(--divider); color: var(--text);
            box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .device.dark { --cell: #1b1e22; --divider: #2b2f35; --icon: #a9afb6; --active: #ffc72c; --text: #e9ebee; --dmuted: #8a9097; --side: #15181b; }
  .dside { background: var(--side); display: flex; flex-direction: column; min-height: 0; border-inline-end: 1px solid var(--divider); }
  .dside ul { list-style: none; margin: 0; padding: 6px; overflow: auto; flex: 1; }
  .room { display: flex; align-items: center; gap: 8px; padding: 9px 8px; border-radius: 6px; cursor: pointer; color: var(--text); font-size: 13px; }
  .room .mdi { font-size: 20px; color: var(--icon); }
  .room.active { background: color-mix(in srgb, var(--active) 18%, transparent); font-weight: 600; }
  .room.active .mdi { color: var(--active); }
  .room .edit { margin-inline-start: auto; opacity: 0; font-size: 16px; }
  .room:hover .edit { opacity: .7; }
  .room .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .addroom { margin: 6px; border: 1px dashed var(--dmuted); color: var(--dmuted); font-size: 12px; padding: 6px; }
  .dmain { display: flex; flex-direction: column; min-height: 0; background: var(--divider); }
  .dtop { flex: none; height: 44px; background: var(--cell); display: flex; align-items: center; padding: 0 10px; gap: 10px; font-size: 15px; border-bottom: 1px solid var(--divider); }
  .dtop .clock { margin-inline-start: auto; color: var(--dmuted); }
  .dtitle { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .dtitle:hover { background: color-mix(in srgb, var(--dmuted) 15%, transparent); }
  .dhome { cursor: pointer; font-size: 22px; color: var(--icon); display: flex; }
  .ftabs { flex: none; display: flex; height: 40px; background: var(--cell); border-bottom: 1px solid var(--divider); }
  .ftab { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; cursor: pointer; position: relative; border-inline-end: .5px solid var(--divider); }
  .ftab .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ftab.on { background: color-mix(in srgb, var(--active) 12%, var(--cell)); font-weight: 600; box-shadow: inset 0 -3px var(--active); }
  .ftab .mdi { font-size: 18px; color: var(--icon); }
  .ftab.on > .mdi { color: var(--active); }
  .ftab .fedit { position: absolute; inset-inline-end: 6px; opacity: .45; display: flex; }
  .ftab .fedit:hover { opacity: 1; }
  .ftab.add { flex: 0 0 48px; }
  .screens { flex: 1; overflow: auto; min-height: 0; }
  .rtile { position: relative; flex-direction: column; align-items: flex-start; justify-content: flex-end; padding: 10px; cursor: grab; background-size: cover; background-position: center; overflow: hidden; }
  .rtile.pic { color: #fff; }
  .rtile.pic::before { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.65)); }
  .rtile > * { position: relative; }
  .rtile .ricon { position: absolute; top: 10px; inset-inline-start: 10px; font-size: 32px; color: var(--icon); }
  .rtile .rname b { display: block; font-size: 13px; text-transform: uppercase; }
  .rtile .rname span { font-size: 11px; opacity: .8; }
  .rtile .redit { position: absolute; top: 6px; inset-inline-end: 6px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
  .rtile .redit .mdi { color: #fff; font-size: 16px; }
  .rtile.also { outline: 1px dashed var(--dmuted); outline-offset: -4px; }
  .rtile.current { box-shadow: inset 0 0 0 3px var(--active); }
  .rtile.dragging { opacity: .3; }
  .screen { display: grid; gap: 0; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(4, 1fr); height: 100%; position: relative; }
  .screen + .screen { border-top: 3px dashed var(--dmuted); }
  .screenlabel { position: absolute; top: 4px; inset-inline-end: 8px; font-size: 11px; color: var(--dmuted); z-index: 2; pointer-events: none; }
  .cell { background: var(--cell); border: .5px solid var(--divider); display: flex; align-items: center; justify-content: center; min-height: 0; }
  .cell.empty { cursor: pointer; color: color-mix(in srgb, var(--dmuted) 35%, transparent); font-size: 26px; }
  .cell.empty:hover { color: var(--dmuted); }
  .cell.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .card { flex-direction: column; gap: 6px; cursor: grab; position: relative; padding: 8px; text-align: center; overflow: hidden; }
  .card .mdi { font-size: 40px; color: var(--icon); }
  .card .lbl { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .kind { position: absolute; top: 6px; inset-inline-start: 8px; font-size: 10px; color: var(--dmuted); }
  .card.wide { flex-direction: row; justify-content: flex-start; padding-inline: 18px; gap: 12px; }
  .card.wide .bar { position: absolute; bottom: 14px; inset-inline: 18px; height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--active) 30%, transparent); }
  /* A room card on a page: as in the rooms menu, its name at the bottom. */
  .card.rtile, .card.rtile.wide { flex-direction: column; align-items: flex-start; justify-content: flex-end; text-align: start; padding: 10px; }
  .card.rtile .ricon { top: 22px; font-size: 28px; }
  .card.rtile.pic .kind { color: rgba(255,255,255,.8); }
  .card.big .ring { width: 62%; aspect-ratio: 1; border-radius: 50%; border: 8px solid color-mix(in srgb, var(--icon) 25%, transparent);
                    border-bottom-color: transparent; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; }
  .card.selected { outline: 3px solid var(--accent); outline-offset: -3px; }
  .card.missing { opacity: .45; }
  .card.dragging { opacity: .3; }

  /* ---- sheets (card properties, pickers, wizard) ---- */
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .sheet { background: var(--pane); border: 1px solid var(--line); border-radius: 14px; width: min(560px, 94vw); max-height: 88vh; overflow: auto; padding: 18px; }
  .sheet h3 { margin: 0 0 4px; font-size: 17px; }
  .sheet .field { margin-top: 14px; }
  .sheet .field > label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .sheet input:not([type=checkbox]), .sheet select { width: 100%; }
  .sheet .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .picklist { list-style: none; margin: 8px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .picklist li { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .picklist li:hover { background: var(--accent-bg); }
  .picklist li .mdi { font-size: 22px; color: var(--muted); }
  .picklist li .grow { flex: 1; }
  .picklist h4 { margin: 10px 0 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .picklist .floorhead { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .picklist .floorhead .grow { flex: 1; }
  .picklist li.off { opacity: .45; cursor: default; }
  .picklist li.off:hover { background: none; }
  /* ---- the add window: a list per kind beside the results (as ETS's settings) ---- */
  .sheet.wide { width: min(980px, 96vw); height: min(680px, 90vh); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .addwin { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .addtop { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .addtop h3 { margin: 0; white-space: nowrap; }
  .addtop input { flex: 1; }
  .addmain { flex: 1; display: flex; min-height: 0; }
  .addnav { list-style: none; margin: 0; padding: 8px; width: 190px; flex: none; border-inline-end: 1px solid var(--line); overflow: auto; }
  .addnav li { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .addnav li:hover { background: var(--accent-bg); }
  .addnav li.on { background: var(--accent-bg); color: var(--accent); }
  .addnav li .mdi { font-size: 20px; }
  .addnav li .grow { flex: 1; }
  .addnav li .n { font-size: 12px; color: var(--muted); }
  .addpane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 16px; gap: 10px; }
  .addfilters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .addfilters select { width: auto; }
  .addfilters:empty { display: none; }
  .addbody { flex: 1; min-height: 0; overflow: auto; }
  .addbody > .picklist { max-height: none; margin: 0; }
  .addsplit { display: grid; grid-template-columns: 220px 1fr; gap: 14px; height: 100%; min-height: 0; }
  .addsplit > * { min-height: 0; overflow: auto; }
  .addsplit .picklist { max-height: none; margin: 0; }
  .picklist.rooms { border-inline-end: 1px solid var(--line); padding-inline-end: 8px; }
  .picklist.rooms li.on { background: var(--accent-bg); color: var(--accent); }
  .addhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .addhead h4 { margin: 4px 0; }
  .sheet.wide .actions { margin: 0; padding: 10px 18px; border-top: 1px solid var(--line); }
  .muted.small { font-size: 12px; margin: 8px 0 0; }
  /* ---- choices, as on the panel: a joined bar, or folded with a search; square switches ---- */
  .seg { display: inline-flex; border: 1px solid var(--line); flex-wrap: wrap; }
  .seg button { border: none; border-inline-end: 1px solid var(--line); padding: 7px 14px; }
  .seg button:last-child { border-inline-end: none; }
  .seg button.on { background: var(--accent); color: #2b2f33; font-weight: 600; }
  .fold { border: 1px solid var(--line); min-width: 240px; background: var(--bg); }
  .foldhead { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; }
  .foldhead .on { color: var(--accent); }
  .foldhead .mdi { color: var(--muted); font-size: 20px; }
  .fold input { width: calc(100% - 16px); margin: 0 8px 6px; }
  .foldlist { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; border-top: 1px solid var(--line); }
  .foldlist li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .foldlist li:hover { background: var(--accent-bg); }
  .foldlist li.on { color: var(--accent); }
  .foldlist li.off { cursor: default; color: var(--muted); }
  input[type=checkbox] { appearance: none; width: 40px; height: 22px; background: var(--line); position: relative; cursor: pointer; vertical-align: middle; border: none; padding: 0; }
  input[type=checkbox]::before { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; background: #fff; transition: inset-inline-start .15s; }
  input[type=checkbox]:checked { background: var(--accent); }
  input[type=checkbox]:checked::before { inset-inline-start: 21px; }
  input[type=checkbox]:disabled { opacity: .45; cursor: default; }
  /* ---- the add palette beside the panel: rows dragged onto empty cells ---- */
  .stage { display: grid; grid-template-columns: minmax(0, 1080px) 340px; gap: 16px; align-items: stretch; }
  /* As high as the panel beside it, whatever its lists hold. */
  .palette { background: var(--pane); border: 1px solid var(--line); contain: size; }
  .palette .addtop { padding: 10px 12px; gap: 10px; }
  .palette .addtop input { min-width: 0; }
  .palette .addmain { flex-direction: column; }
  .palette .addnav { width: auto; display: flex; overflow-x: auto; border-inline-end: none; border-bottom: 1px solid var(--line); }
  .palette .addnav li { flex: none; padding: 10px 12px; border-bottom: none; }
  .palette .addnav li .grow { display: none; }
  .palette .addpane { padding: 8px 10px; }
  .palette .addsplit { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .palette .picklist.rooms { border-inline-end: none; max-height: 28%; border-bottom: 1px solid var(--line); }
  .palette li[draggable] { cursor: grab; }
  .palette .muted.small { padding: 6px 12px 10px; margin: 0; }
  @media (max-width: 1150px) { .stage { grid-template-columns: minmax(0, 1fr); } .palette { display: none; } }
  @media (max-width: 700px) {
    .addmain { flex-direction: column; }
    .addnav { width: auto; display: flex; overflow-x: auto; border-inline-end: none; border-bottom: 1px solid var(--line); }
    .addnav li { flex: none; margin: 0; }
    .addsplit { grid-template-columns: 1fr; }
    .picklist.rooms { border-inline-end: none; max-height: 30vh; }
  }
  .steps { display: flex; gap: 6px; margin: 6px 0 14px; }
  .steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .steps span.done { background: var(--accent); }
  .bigcode { font-family: monospace; font-size: 40px; letter-spacing: 8px; color: var(--accent); text-align: center; margin: 14px 0; }
  .floorbox { margin-top: 8px; }
  .floorbox b { font-size: 13px; color: var(--muted); }
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 10px; margin-top: 4px; }
  .checks label { display: flex; gap: 6px; align-items: center; }
  .icon-preview { font-size: 26px; vertical-align: middle; margin-inline-start: 8px; color: var(--accent); }
  .devtable input, .devtable select { width: 100%; }
  .devtable td { padding: 5px 6px; }
  .toast { position: fixed; bottom: 18px; inset-inline-start: 50%; transform: translateX(50%); background: var(--pane); border: 1px solid var(--line);
           border-radius: 10px; padding: 10px 16px; z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,.25); }

  /* ---- ETS look: square corners, flat buttons, lists in ruled rows, a bar on the chosen one.
     Colours stay; the panel preview (.device) keeps the panel's own look. ---- */
  button, input, select, .chip, .box, .sheet, .navitem, .request, .picklist li, .addnav li, .tabs button,
  .room, .dtitle, .steps span, .toast { border-radius: 0; }
  button { padding: 6px 16px; transition: background .1s; }
  button:hover:not(:disabled) { background: var(--accent-bg); }
  button.solid:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 85%, #000); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .chip { padding: 4px 12px; }
  .chip.on { box-shadow: inset 0 -2px 0 var(--accent); }
  /* Side lists: ruled rows, the chosen one marked by a bar on its inner edge. */
  nav { padding: 0; }
  nav h2 { margin: 16px 12px 6px; }
  .navitem { padding: 10px 14px; border-bottom: 1px solid var(--line); border-inline-start: 3px solid transparent; }
  .navitem.active { background: var(--bg); border-inline-start-color: var(--accent); }
  .tabs { gap: 0; border-bottom: 1px solid var(--line); }
  .tabs button { border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 8px 16px; }
  .tabs button.active { background: none; border-bottom-color: var(--accent); }
  .box { box-shadow: none; }
  .sheet { box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .picklist li { border-bottom: 1px solid var(--line); padding: 9px 10px; }
  .picklist li:last-child { border-bottom: none; }
  .picklist h4 { margin: 14px 0 4px; text-transform: none; }
  .addnav { padding: 0; background: var(--bg); }
  .addnav li { margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); border-inline-start: 3px solid transparent; }
  .addnav li.on { background: var(--pane); border-inline-start-color: var(--accent); color: var(--accent); }
  .picklist.rooms li { border-inline-start: 3px solid transparent; }
  .picklist.rooms li.on { border-inline-start-color: var(--accent); }
  .addtop, .sheet.wide .actions { background: var(--pane); }
</style>
</head>
<body>
<header>
  <h1>Wall Panel Hub <span class="muted" id="version"></span></h1>
  <span id="pinWarning" class="warn" hidden data-i18n>⚠ No installer PIN: anyone can open the panels' settings. Set it in the project.</span>
  <span class="spacer"></span>
  <select id="lang" aria-label="Language"></select>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="veil" class="veil" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="static/vendor/Sortable.min.js"></script>
<script src="static/i18n.js"></script>
<script src="static/designer.js"></script>
</body>
</html>
