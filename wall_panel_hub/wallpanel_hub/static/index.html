<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Panels</title>
<style>
  @font-face { font-family: "mdi"; src: url("static/vendor/mdi/materialdesignicons.ttf") format("truetype"); font-display: block; }
  :root {
    --bg: #111317; --pane: #181b20; --fg: #e9ebee; --muted: #8c9298; --line: #2b2f35;
    --accent: #e0a060; --accent-bg: rgba(224,160,96,.14); --danger: #e06060; --ok: #6cc56c;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2f3f5; --pane: #fff; --fg: #2b2f33; --muted: #6b7178; --line: #d7dade; --accent: #9a6420; --accent-bg: rgba(154,100,32,.10); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; }
  button { background: none; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
           cursor: pointer; font: inherit; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  input, select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; }
  input[type=checkbox] { width: auto; }
  .muted { color: var(--muted); font-size: 13px; }
  .mdi { font-family: "mdi"; font-style: normal; line-height: 1; display: inline-block; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--pane); }
  header h1 { font-size: 16px; margin: 0; }
  header .warn { color: var(--accent); font-size: 13px; }
  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }

  /* ---- navigation ---- */
  nav { border-inline-end: 1px solid var(--line); background: var(--pane); overflow: auto; padding: 10px; }
  nav h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 14px 6px 6px; }
  .navitem { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .navitem:hover { background: var(--accent-bg); }
  .navitem.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .navitem .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { font-size: 10px; } .dot.on { color: var(--ok); } .dot.off { color: var(--muted); }
  .request { border: 1px dashed var(--accent); border-radius: 8px; padding: 8px 10px; margin: 4px 0; }
  .request .code { font-family: monospace; font-size: 18px; letter-spacing: 3px; color: var(--accent); }

  main { overflow: auto; padding: 16px 20px; min-width: 0; }
  .titlebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .titlebar h2 { margin: 0; font-size: 18px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .spacer { flex: 1; }
  .box { background: var(--pane); border: 1px solid var(--line); border-radius: 12px; padding: 16px; max-width: 820px; margin-bottom: 16px; }
  .box h3 { font-size: 14px; margin: 0 0 10px; }
  .form { display: grid; grid-template-columns: 220px 1fr; gap: 10px 14px; align-items: center; }
  .form label { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: middle; }
  th { color: var(--muted); font-weight: normal; font-size: 13px; }
  .access td, .access th { text-align: center; } .access td:first-child, .access th:first-child { text-align: start; }
  .msg { font-size: 13px; margin-top: 8px; } .msg.ok { color: var(--ok); } .msg.error { color: var(--danger); } .msg.warn { color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 16px; padding: 4px 12px; cursor: pointer; user-select: none; font-size: 13px; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .chip.off { opacity: .4; cursor: default; }

  /* ---- the panel, as it looks on the wall: the app's own sizes (dp) on a 1280x800
         canvas, scaled to the page; colours from Theme.kt (PanelColors) ---- */
  .devicewrap { width: 100%; max-width: 1180px; }
  .bezel { border: 12px solid #16181b; border-radius: 22px; box-shadow: 0 10px 34px rgba(0,0,0,.3); overflow: hidden; position: relative; }
  .device { --cell: #ffffff; --divider: #d7dade; --icon: #5f656c; --active: #f2b300; --text: #2b2f33; --dmuted: #8c9298;
            --control: #f1f2f4; --selection: #f4f1ea; --cover: #926bc7;
            width: 1280px; height: 800px; position: absolute; top: 0; left: 0; transform-origin: top left; display: flex;
            background: var(--divider); color: var(--text); font-family: Roboto, system-ui, sans-serif; }
  .device.dark { --cell: #1b1e22; --divider: #2b2f35; --icon: #a9afb6; --active: #ffc72c; --text: #e9ebee; --dmuted: #8a9097;
                 --control: #262a2f; --selection: #2a2721; }
  .dside { width: 210px; background: var(--cell); display: flex; flex-direction: column; margin-inline-end: 1px; flex: none; }
  .dside .line { height: 1px; background: var(--divider); flex: none; }
  .dside ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  .sitem { display: flex; align-items: center; padding: 14px 16px; background: var(--cell); cursor: pointer; font-size: 16px; position: relative; }
  .sitem .mark { width: 3px; height: 28px; margin-inline-end: 10px; flex: none; }
  .sitem .mdi { font-size: 30px; color: var(--icon); margin-inline-end: 12px; flex: none; }
  .sitem .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sitem.active { background: var(--selection); font-weight: 600; }
  .sitem.active .mark { background: var(--active); }
  .sitem.active .mdi { color: var(--active); }
  .sitem.fixed { cursor: default; opacity: .7; }
  .sitem .edit { position: absolute; inset-inline-end: 8px; font-size: 22px; color: var(--dmuted); opacity: 0; margin: 0; }
  .sitem:hover .edit { opacity: 1; }
  .addroom { margin: 8px 16px; border: 1.5px dashed var(--dmuted); color: var(--dmuted); font-size: 15px; padding: 10px; border-radius: 10px; background: none; }
  .dmain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .dtop { height: 56px; background: var(--cell); position: relative; margin-bottom: 1px; flex: none; }
  .dtop .home { position: absolute; inset-inline-start: 20px; top: 14px; font-size: 28px; color: var(--icon); }
  .dtop .title { position: absolute; left: 80px; right: 80px; top: 0; line-height: 56px; text-align: center; font-size: 20px; white-space: nowrap; overflow: hidden; }
  .dtop .clock { position: absolute; inset-inline-end: 20px; top: 0; line-height: 56px; font-size: 20px; }
  .screens { flex: 1; min-height: 0; position: relative; }
  .screen { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); }
  .pagedots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 5; }
  .pagedots span { width: 14px; height: 14px; border-radius: 50%; background: var(--divider); cursor: pointer; }
  .pagedots span.on { background: var(--active); }
  .cell { background: var(--cell); box-shadow: inset 0 0 0 .75px var(--divider); position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  .cell.empty { display: flex; align-items: center; justify-content: center; color: transparent; font-size: 44px; }
  .cell.empty.open { cursor: pointer; color: color-mix(in srgb, var(--dmuted) 30%, transparent); }
  .cell.empty.open:hover { color: var(--dmuted); background: color-mix(in srgb, var(--active) 7%, var(--cell)); }
  .cell.over { box-shadow: inset 0 0 0 3px var(--active); }
  .card { cursor: grab; }
  .card.selected::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--accent); pointer-events: none; z-index: 4; }
  .card.missing > * { opacity: .45; }
  .card.dragging { opacity: .3; }
  .card .mdi { color: var(--icon); }
  .card .mdi.on { color: var(--active); }
  .card .mdi.cov { color: var(--cover); }
  /* standard cell: icon in the middle, name under it, value in the corner */
  .std { position: absolute; inset: 10px; }
  .std .val { position: absolute; top: 0; inset-inline-end: 0; font-size: 14px; color: var(--dmuted); font-weight: 500; }
  .std .val.bottom { top: auto; bottom: 0; inset-inline-start: 0; inset-inline-end: auto; }
  .std .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .std .mid .mdi { font-size: 46px; }
  .std .mid .lbl { margin-top: 8px; font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  .std.side .mid .lbl { padding-inline: 46px; }
  .steps { position: absolute; top: 0; bottom: 0; inset-inline-end: 0; width: 64px; padding: 14px 0; display: flex; flex-direction: column;
           justify-content: space-evenly; align-items: center; }
  .rbtn { border-radius: 50%; background: var(--control); display: flex; align-items: center; justify-content: center; flex: none; }
  .rbtn .mdi { color: var(--icon); }
  /* 2x1 light / shutter: icon and name side by side, slim bar under them */
  .wide { position: absolute; inset: 12px 16px; display: flex; flex-direction: column; justify-content: space-evenly; }
  .wide .head { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .wide .head > .mdi { font-size: 40px; flex: none; }
  .wide .names { flex: 1; min-width: 0; }
  .wide .name { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wide .sub { font-size: 13px; color: var(--dmuted); }
  .wide .btns { display: flex; gap: 8px; }
  .wide .bar { height: 34px; border-radius: 17px; position: relative; overflow: hidden; }
  .wide .bar i { position: absolute; top: 0; bottom: 0; inset-inline-start: 0; border-radius: 17px; }
  .wide .bar b { position: absolute; top: 20%; bottom: 20%; width: 3px; border-radius: 2px; background: #fff; }
  .wide .pct { position: absolute; top: -2px; inset-inline-end: -4px; font-size: 14px; color: var(--dmuted); }
  /* 2x2 dial, as DialPanel */
  .dial { position: absolute; inset: 14px; }
  .dial .dtitle { position: absolute; top: 0; left: 70px; right: 70px; text-align: center; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dial .switch { position: absolute; top: 0; inset-inline-end: 0; width: 64px; height: 32px; border-radius: 16px; padding: 4px; display: flex; }
  .dial .switch i { width: 24px; height: 24px; border-radius: 50%; background: var(--cell); }
  .dial svg { position: absolute; left: 0; right: 0; top: 36px; bottom: 8px; margin: auto; }
  .dial .minus, .dial .plus { position: absolute; bottom: 0; }
  .dial .minus { inset-inline-start: 0; } .dial .plus { inset-inline-end: 0; }
  /* other cells */
  .scenes { position: absolute; inset: 10px; display: flex; flex-direction: column; }
  .scenes .row2 { flex: 1; display: flex; justify-content: space-evenly; align-items: center; }
  .scenes .one { display: flex; flex-direction: column; align-items: center; font-size: 13px; max-width: 120px; }
  .scenes .one .mdi { font-size: 34px; }
  .multi { position: absolute; inset: 14px; display: flex; flex-direction: column; justify-content: space-evenly; }
  .multi div { display: flex; align-items: center; gap: 10px; font-size: 20px; }
  .multi .mdi { font-size: 24px; }
  .clockcell { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .clockcell b { font-size: 84px; font-weight: 300; direction: ltr; }
  .clockcell span { font-size: 20px; color: var(--dmuted); }
  .kindtag { position: absolute; bottom: 4px; inset-inline-end: 8px; font-size: 12px; color: var(--dmuted); opacity: 0; z-index: 3; }
  .card:hover .kindtag { opacity: 1; }

  /* ---- sheets (card properties, pickers, wizard) ---- */
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .sheet { background: var(--pane); border: 1px solid var(--line); border-radius: 14px; width: min(560px, 94vw); max-height: 88vh; overflow: auto; padding: 18px; }
  .sheet h3 { margin: 0 0 4px; font-size: 17px; }
  .sheet .field { margin-top: 14px; }
  .sheet .field > label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .sheet input:not([type=checkbox]), .sheet select { width: 100%; }
  .sheet .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .picklist { list-style: none; margin: 8px 0 0; padding: 0; max-height: 46vh; overflow: auto; }
  .picklist li { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .picklist li:hover { background: var(--accent-bg); }
  .picklist li .mdi { font-size: 22px; color: var(--muted); }
  .picklist li .grow { flex: 1; }
  .picklist h4 { margin: 10px 0 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .wsteps { display: flex; gap: 6px; margin: 6px 0 14px; }
  .wsteps span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .wsteps span.done { background: var(--accent); }
  .bigcode { font-family: monospace; font-size: 40px; letter-spacing: 8px; color: var(--accent); text-align: center; margin: 14px 0; }
  .floorbox { margin-top: 8px; }
  .floorbox b { font-size: 13px; color: var(--muted); }
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 10px; margin-top: 4px; }
  .checks label { display: flex; gap: 6px; align-items: center; }
  .icon-preview { font-size: 26px; vertical-align: middle; margin-inline-start: 8px; color: var(--accent); }
  .devtable input, .devtable select { width: 100%; }
  .devtable td { padding: 5px 6px; }
  .toast { position: fixed; bottom: 18px; inset-inline-start: 50%; transform: translateX(50%); background: var(--pane); border: 1px solid var(--line);
           border-radius: 10px; padding: 10px 16px; z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
</style>
</head>
<body>
<header>
  <h1>Wall Panel Hub <span class="muted" id="version"></span></h1>
  <span id="pinWarning" class="warn" hidden>⚠ لم تُضبط كلمة سر المُركِّب: أي شخص يستطيع فتح إعدادات الشاشات. اضبطها من المشروع.</span>
  <span class="spacer"></span>
  <a href="editor" class="muted">المحرر المتقدم</a>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="veil" class="veil" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="static/vendor/Sortable.min.js"></script>
<script src="static/designer.js"></script>
</body>
</html>
